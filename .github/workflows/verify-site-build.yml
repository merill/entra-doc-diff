name: Verify site build

# Rebuilds the committed site from the same inputs that produced it and fails if
# the generated pages differ. Pinning SITE_GENERATED_AT removes the timestamp,
# so an empty diff is a real proof that a change is behaviour-preserving.
#
# website/pagefind/** and search-manifest.json are compared separately: Pagefind
# re-hashes and re-groups its index files on every run even when the indexed
# content is byte-identical, so a raw diff there is pure noise. What matters is
# that the index still covers the same records and pages, which is asserted below.

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone Entra Docs repository
        run: git clone --filter=blob:limit=100k --single-branch https://github.com/MicrosoftDocs/entra-docs.git entra-docs

      - name: Clone Message Center repository
        run: git clone --depth 1 https://github.com/merill/mc.git mc

      - name: Set up the dailynews engine
        # Resolves without a token: this repository and the engine are both
        # private, and the engine allows repositories owned by the same user to
        # use its actions, so GitHub checks it out with this workflow's token.
        uses: merill/dailynews-engine/.github/actions/setup@v1.0.2

      - name: Record the committed search coverage
        run: |
          node -e "
            const m = require('./website/search-manifest.json');
            const e = require('./website/pagefind/pagefind-entry.json');
            const { generatedAt, ...counts } = m;
            console.log(JSON.stringify({ ...counts, pages: e.languages.en.page_count }));
          " > committed-coverage.json
          cat committed-coverage.json

      - name: Rebuild the site at the committed generation time
        env:
          MC_DATA_PATH: './mc/@data'
          KIT_DAILY_FORM_UID: ${{ secrets.KIT_DAILY_FORM_UID }}
          KIT_DAILY_FORM_EMBED_SRC: ${{ secrets.KIT_DAILY_FORM_EMBED_SRC }}
          USERJOT_PROJECT_ID: ${{ vars.USERJOT_PROJECT_ID }}
        run: |
          # refresh-status.json is written by the monitor, so its lastCheckedAt is
          # a stable record of the generation time behind the committed HTML.
          SITE_GENERATED_AT="$(node -p "require('./website/refresh-status.json').lastCheckedAt")"
          echo "Rebuilding as of $SITE_GENERATED_AT"
          SITE_GENERATED_AT="$SITE_GENERATED_AT" dailynews build-site
          SITE_GENERATED_AT="$SITE_GENERATED_AT" dailynews search-index

      - name: Capture the difference
        if: always()
        run: |
          git diff -- website/ ':(exclude)website/pagefind' ':(exclude)website/search-manifest.json' > site.diff || true
          wc -l site.diff

      - name: Upload the difference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-diff
          path: site.diff
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail when the generated pages changed
        run: |
          if ! git diff --quiet -- website/ ':(exclude)website/pagefind' ':(exclude)website/search-manifest.json'; then
            echo "::error::Rebuilding produced different pages. Download the site-diff artifact to review it."
            git diff --stat -- website/ ':(exclude)website/pagefind' ':(exclude)website/search-manifest.json'
            exit 1
          fi
          echo "The rebuild reproduced every generated page exactly."

      - name: Fail when the search index no longer covers the same content
        run: |
          node -e "
            const m = require('./website/search-manifest.json');
            const e = require('./website/pagefind/pagefind-entry.json');
            const { generatedAt, ...counts } = m;
            const rebuilt = { ...counts, pages: e.languages.en.page_count };
            const committed = require('./committed-coverage.json');
            const a = JSON.stringify(committed), b = JSON.stringify(rebuilt);
            if (a !== b) {
              console.error('::error::Search coverage changed.');
              console.error('  committed: ' + a);
              console.error('  rebuilt:   ' + b);
              process.exit(1);
            }
            console.log('Search coverage is unchanged: ' + b);
          "
