name: Publish Daily Kit Broadcast

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      auto_mode:
        description: Reconcile the current UTC day after 08:15 and verify recent delivery
        required: false
        type: boolean
        default: false
      report_date:
        description: Report date to publish (UTC, YYYY-MM-DD); defaults to today
        required: false
        type: string
      draft_mode:
        description: Create a Kit draft without scheduling or sending it
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      report_date:
        description: Report date to publish (UTC, YYYY-MM-DD); defaults to today
        required: false
        type: string
      draft_mode:
        description: Create a Kit draft without scheduling or sending it
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-kit-broadcast
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Signal manual production start
      if: github.event_name == 'workflow_dispatch' && inputs.draft_mode != true
      continue-on-error: true
      env:
        HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      run: |
        if [ -z "$HEALTHCHECKS_PING_URL" ]; then
          echo "HEALTHCHECKS_PING_URL is not configured; skipping the external heartbeat."
          exit 0
        fi
        curl --fail --silent --show-error --max-time 10 --retry 3 "${HEALTHCHECKS_PING_URL%/}/start"

    - name: Checkout the published website
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Select today's report
      id: report
      env:
        AUTO_MODE: ${{ inputs.auto_mode }}
        REQUESTED_DATE: ${{ inputs.report_date }}
      run: |
        if [ "$AUTO_MODE" = "true" ]; then
          echo "Automatic same-day reconciliation is enabled."
          echo "auto=true" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        REPORT_DATE="${REQUESTED_DATE:-$(date -u +'%Y-%m-%d')}"
        if ! [[ "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "Invalid report date: $REPORT_DATE" >&2
          exit 1
        fi
        if [ ! -f "website/$REPORT_DATE.json" ]; then
          echo "No report exists for $REPORT_DATE; no Kit broadcast will be created."
          echo "available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "auto=false" >> "$GITHUB_OUTPUT"
        echo "date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
        echo "available=true" >> "$GITHUB_OUTPUT"

    - name: Create a Kit draft or publish at most one daily broadcast
      if: steps.report.outputs.available == 'true'
      env:
        KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        KIT_DRAFT_MODE: ${{ inputs.draft_mode }}
        KIT_SCHEDULE_DELAY_MINUTES: "5"
        KIT_SEND_VERIFICATION_GRACE_MINUTES: "30"
        AUTO_MODE: ${{ steps.report.outputs.auto }}
        REPORT_DATE: ${{ steps.report.outputs.date }}
      run: |
        if [ "$AUTO_MODE" = "true" ]; then
          node scripts/publish-kit-broadcast.js --auto
        else
          node scripts/publish-kit-broadcast.js --date "$REPORT_DATE"
        fi

  notify-failure:
    name: Email Merill when the subscriber email fails
    needs: publish
    if: always() && needs.publish.result == 'failure'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout notification script
      uses: actions/checkout@v4

    - name: Send failure email
      continue-on-error: true
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        FAILURE_RECIPIENT_EMAIL: "merill@merill.net"
        FAILURE_COMPONENT: "subscriber email"
      run: node scripts/send-workflow-failure-email.js

  report-health:
    name: Report manual production health
    needs: publish
    if: always() && github.event_name == 'workflow_dispatch' && inputs.draft_mode != true
    runs-on: ubuntu-latest
    steps:
    - name: Signal manual production result
      continue-on-error: true
      env:
        HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        KIT_RESULT: ${{ needs.publish.result }}
      run: |
        if [ -z "$HEALTHCHECKS_PING_URL" ]; then
          echo "HEALTHCHECKS_PING_URL is not configured; skipping the external heartbeat."
          exit 0
        fi
        PING_URL="${HEALTHCHECKS_PING_URL%/}"
        if [ "$KIT_RESULT" != "success" ]; then
          PING_URL="$PING_URL/fail"
        fi
        curl --fail --silent --show-error --max-time 10 --retry 3 "$PING_URL"
