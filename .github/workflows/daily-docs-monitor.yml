name: Daily Entra Docs Monitor

permissions:
  contents: write
  
on:
  schedule:
    # Run after the 07:30 UTC MicrosoftDocs publish/sync cycle, with time for late changes to settle.
    - cron: '15 8 * * *'
  workflow_dispatch: # Allow manual triggering for testing

concurrency:
  group: entra-docs-monitor
  cancel-in-progress: false

jobs:
  monitor-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4
      
    - name: Clone Entra Docs repository
      run: git clone https://github.com/MicrosoftDocs/entra-docs.git entra-docs

    - name: Clone Message Center repository
      run: git clone --depth 1 https://github.com/merill/mc.git mc
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run docs monitor
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_SUMMARY_MODEL: "gpt-5.6-luna"
        OPENAI_SUMMARY_REASONING_EFFORT: "medium"
        OPENAI_SUMMARY_CONCURRENCY: "3"
        DISCORD_ENTRA_SCOUT_WEBHOOK_URL: ${{ secrets.DISCORD_ENTRA_SCOUT_WEBHOOK_URL }}
        MC_DATA_PATH: "./mc/@data"
        RECIPIENT_EMAIL: "merill@merill.net"
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        GITHUB_ACTIONS: "true"
      run: node src/monitor-docs.js
      
    - name: Configure Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        
    - name: Commit and push website changes
      run: |
        git add website/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update website with daily report - $(date +'%Y-%m-%d')"
          git push
        fi
      
    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-report-${{ github.run_number }}
        path: reports/
        retention-days: 30
