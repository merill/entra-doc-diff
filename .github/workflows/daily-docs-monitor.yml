name: Daily Entra Docs Monitor

permissions:
  contents: write
  
on:
  schedule:
    # Four-hour UTC cadence. The dedicated 08:15 run also sends the daily email.
    - cron: '15 0,4,12,16,20 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      backfill_period_summaries:
        description: Regenerate historical weekly and monthly editorial briefs
        required: false
        type: boolean
        default: false
      send_email:
        description: Send the pending daily email digest during this manual run
        required: false
        type: boolean
        default: false
      backfill_dates:
        description: Regenerate recovered dates without sending email or Discord (comma-separated YYYY-MM-DD)
        required: false
        type: string
        default: ''

concurrency:
  group: entra-docs-monitor
  cancel-in-progress: false

jobs:
  monitor-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4
      
    - name: Clone Entra Docs repository
      run: git clone https://github.com/MicrosoftDocs/entra-docs.git entra-docs

    - name: Clone Message Center repository
      run: git clone --depth 1 https://github.com/merill/mc.git mc
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run docs and Message Center monitor
      if: inputs.backfill_dates == ''
      id: monitor
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_SUMMARY_MODEL: "gpt-5.6-luna"
        OPENAI_SUMMARY_REASONING_EFFORT: "xhigh"
        OPENAI_SUMMARY_CONCURRENCY: "3"
        DISCORD_ENTRA_SCOUT_WEBHOOK_URL: ${{ secrets.DISCORD_ENTRA_SCOUT_WEBHOOK_URL }}
        DISCORD_ENABLED: ${{ inputs.backfill_period_summaries != true }}
        EMAIL_ENABLED: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 8 * * *') || (github.event_name == 'workflow_dispatch' && inputs.send_email == true) }}
        MC_DATA_PATH: "./mc/@data"
        RECIPIENT_EMAIL: "merill@merill.net"
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        GITHUB_ACTIONS: "true"
      run: node src/monitor-docs.js

    - name: Regenerate recovered per-change summaries
      if: inputs.backfill_dates != ''
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_SUMMARY_MODEL: "gpt-5.6-luna"
        OPENAI_SUMMARY_REASONING_EFFORT: "xhigh"
        OPENAI_SUMMARY_CONCURRENCY: "3"
      run: node scripts/regenerate-diff-summaries.js --dates="${{ inputs.backfill_dates }}"

    - name: Generate daily, weekly, and monthly editorial briefs
      if: steps.monitor.outputs.content_changed == 'true' || inputs.backfill_period_summaries == true || inputs.backfill_dates != ''
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_PERIOD_SUMMARY_MODEL: "gpt-5.6-luna"
        OPENAI_PERIOD_SUMMARY_REASONING_EFFORT: "xhigh"
        OPENAI_PERIOD_SUMMARY_BUDGET_USD: "1.25"
        OPENAI_PERIOD_SUMMARY_DAILY_BUDGET_USD: "0.25"
        MC_DATA_PATH: "./mc/@data"
      run: |
        if [ -n "${{ inputs.backfill_dates }}" ]; then
          node scripts/generate-period-summaries.js --dates="${{ inputs.backfill_dates }}" --force
        elif [ "${{ inputs.backfill_period_summaries }}" = "true" ]; then
          node scripts/generate-period-summaries.js --all
        else
          node scripts/generate-period-summaries.js --current --force
        fi
        npm run build:site
      
    - name: Configure Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        
    - name: Commit and push website changes
      run: |
        git add website/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Refresh Entra.News content - $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
        fi
      
    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-report-${{ github.run_number }}
        path: reports/
        retention-days: 30

  notify-failure:
    name: Email Merill when the refresh fails
    needs: monitor-docs
    if: always() && needs.monitor-docs.result == 'failure'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout notification script
      uses: actions/checkout@v4

    - name: Send failure email
      continue-on-error: true
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        FAILURE_RECIPIENT_EMAIL: "merill@merill.net"
      run: node scripts/send-workflow-failure-email.js
