<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day calendar design comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e7df; color: #1d2723; font: 16px/1.4 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; min-height: 100vh; }
    figure { margin: 0; padding: 16px; background: #f7f5ef; }
    figcaption { margin-bottom: 10px; font-weight: 700; }
    img { display: block; width: 100%; height: auto; border: 1px solid #c9c8c0; }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>Before — day view right rail</figcaption>
      <img src="day-calendar-before.png" alt="Day view before the calendar was added">
    </figure>
    <figure>
      <figcaption>After — month calendar and day-by-product rail</figcaption>
      <img src="day-calendar-after.png" alt="Day view with the compact month calendar">
    </figure>
  </main>
</body>
</html>
